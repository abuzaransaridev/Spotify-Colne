<!doctype html>
<html>
	<head>
		<title>		
			Spotify
		</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />		
		<style>
			body
			{
				margin:0;
				padding:0;
				font-family: Arial, sans-serif;
				background-color:black;
			}
			nav
			{
				width:100%;
				background-color:black;
				
				display:flex;
				align-items:center;
			}
			.n_logo
			{

				padding:10px 0;
				margin-left:2%;
			}
			.home_logo
			{
				border-radius:100%;
				background-color:#2A2A2A;
				padding:10px;
				margin-left:2%;
				
			}
			.home_logo span
			{
				font-size:24px;
				color:white;				
			}
			.input_box
			{
				width:40%;
				background-color:#2A2A2A;
				display:flex;
				align-items:center;
				border-radius:30px;
				margin-left:2%;
			}
			.search
			{
				padding:10px;
				font-size:24px;
				color:#8e8e8e;
				display:flex;
				align-items:center;				
			}
			.input
			{				
				height:40px;
				width:80%;
				padding-left:2%;
				background-color:#2A2A2A;
				border:none;
				font-size:17px;
				color: #2ed573;				
			}
			
			input::placeholder {
			  color:#8e8e8e;
			}
			.divider
			{
				border-left:1px solid #8e8e8e;
				height:25px;		
			}
			
			.pre
			{
				background-color:white;
				height:10%;
				width:12%;
				border-radius:30px;
				padding-bottom:0.5%;
				padding-top:0.5%;
				padding-left:0.5%;
				padding-right:0.5%;
				font-size:15px;
				margin-left:17%;
				
			}
			
			.pres
			{
				color:#8e8e8e;
				height:10%;
				width:7.5%;
				border-radius:12px;
				padding-bottom:0.5%;
				padding-top:0.5%;
				padding-left:0.5%;
				padding-right:0.5%;
				font-size:16px;
				margin-left:2%;
			}
		
			.press
			{
				color:#8e8e8e;
				height:10%;
				width:2%;
				border-radius:12px;
				padding-bottom:0.5%;
				padding-top:0.5%;
				padding-left:0.5%;
				padding-right:0.5%;
				font-size:16px;
				margin-left:-4%;
			}
			
			.presss
			{
				color:white;
				height:10%;
				width:2%;
				border-radius:20px;
				padding-bottom:0.5%;
				padding-top:0.5%;
				padding-left:1%;
				padding-right:0.5%;
				font-size:16px;
				margin-left:2%;
				background-color:#18E088;
			}
			main{								
				padding:.5%;
				display:flex;
				justify-content:space-between;
				align-items:center;				
			}			
			.left-aside
			{
				width:22%;
				height:460px;
				background-color:yellow;
				border-radius:10px;

				
			}			
			.main_section {
				width: 55%;
				background-color: green;
				border-radius: 10px;
				height: 460px;
				overflow-x: hidden;
				overflow-y: scroll;

				display: flex;
				justify-content: center;
			}

			.main_section::-webkit-scrollbar {
				width: 7px;
			}

			.main_section::-webkit-scrollbar-track {
				background: transparent;
				margin-top:5px;
				margin-bottom:5px;
			}
				
			.main_section::-webkit-scrollbar-thumb {
				background: #5a5a5a;
				border-radius: 30px;
			}

			.main_section::-webkit-scrollbar-thumb:hover {
				background: #777;
			}
			.main_section::-webkit-scrollbar-button{
				display: none;
			}
		
			.overflow_box
			{
				height:1500px;
				width:80%;
				background-color:blue;
			}
			.right_aside
			{
				width:22%;
				height:460px;
				background-color:yellow;
				border-radius:10px;

			}
			.footer
			{
				background-color:red;
				border-top:1px solid white;
				width:100%;
				height:50px;
			}
		</style>
	</head>
	
	<body>
		<header>			
			<nav>
				<div class="n_logo">
					<img alt="spotify-logo" height="33" width="33" src="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_White.png">				
				</div>
				<div class="home_logo">
					<span>
						<i class="ri-home-5-fill"></i>
					</span>
				</div>
				<div class="input_box">
					<div class="search">
						<i class="ri-search-line"></i>
					</div>
					<input  class="input" type="text" placeholder=" What do you want to play? " >
					<div class="divider">
					</div>
					<div class="search">
						<i class="ri-folder-open-line"></i>
					</div>
				</div>
				<div class ="pre">
					<b>
						Explore Premium
					</b>
				</div>
				
				<div class ="pres">
					<b>
						Install App
					</b>
				</div>
				
				<div class ="pres">
					<b>
						<i class="ri-notification-4-line"></i>
					</b>
				</div>
				
				<div class ="press">
					<b>
						<i class="ri-team-fill"></i>
					</b>
				</div>
				
				<div class ="presss">
					<b>
						A
					</b>
				</div>
			</nav>
		</header>
		<main>
			<aside class="left-aside">
					
			</aside>			
			<section class="main_section">
				<div class="overflow_box">
				
				</div>
			
			</section>
			<aside class="right_aside">
			
			
			</aside>
		</main>	
		<footer class="footer">
		
		</footer>
	</body>
</html>
